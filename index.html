<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
 <meta name="google-site-verification" content="xSMe8NjOJitIbihp_Rs4ctuOhG8ogC3gYNH4PRTPxKA" />
<title>Base64Encoder</title>
<style>
  * {
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: #f7f7f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .drop {
    width: 320px;
    height: 180px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: 0.25s;
    position: relative;
  }

  .drop:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.12);
  }

  .plus {
    font-size: 48px;
    color: #bbb;
    line-height: 1;
  }

  .label {
    font-size: 12px;
    color: #999;
    letter-spacing: 0.05em;
  }

  .drop input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .loader {
    width: 36px;
    height: 36px;
    border: 3px solid #ddd;
    border-top-color: #888;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .out-wrap {
    position: relative;
    width: 90%;
    max-width: 800px;
  }

  textarea {
    width: 100%;
    height: 40vh;
    padding: 16px;
    border-radius: 14px;
    border: none;
    resize: none;
    font-size: 12px;
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }

  .copy {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #ffffffcc;
    border: none;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
    transition: 0.2s;
    backdrop-filter: blur(6px);
  }

  .copy:hover {
    background: #fff;
    color: #000;
  }

  .copy.copied {
    color: #4caf50;
  }
</style>
</head>
<body>

<div class="drop">
  <div class="plus">＋</div>
  <div class="label">ファイルを追加</div>
  <input type="file" id="file">
</div>

<div class="loader" id="loader"></div>

<div class="out-wrap">
  <button class="copy" id="copy">コピー</button>
  <textarea id="out"></textarea>
</div>

<script>
const file = document.getElementById("file");
const out = document.getElementById("out");
const loader = document.getElementById("loader");
const copy = document.getElementById("copy");

file.addEventListener("change", () => {
  const f = file.files[0];
  if (!f) return;

  loader.style.display = "block";
  out.value = "";

  const r = new FileReader();
  r.onload = () => {
    out.value = r.result;
    loader.style.display = "none";
  };
  r.readAsDataURL(f);
});

copy.addEventListener("click", async () => {
  if (!out.value) return;
  await navigator.clipboard.writeText(out.value);
  copy.textContent = "コピー済み";
  copy.classList.add("copied");
  setTimeout(() => {
    copy.textContent = "コピー";
    copy.classList.remove("copied");
  }, 1200);
});
</script>

</body>
</html>
